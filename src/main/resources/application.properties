spring.application.name=diversidades
server.port=8081

# Estratégia de nomes do Hibernate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Banco de dados (Oracle)
spring.datasource.url=jdbc:oracle:thin:@//HOST:PORT/SERVICE_NAME
spring.datasource.username=SEU_USUARIO
spring.datasource.password=SUA_SENHA

# Dialeto Hibernate (compatível com Spring Boot 3 / Hibernate 6)
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.repair-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

# Hibernate não cria nem altera schema
spring.jpa.hibernate.ddl-auto=none

# Logs SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tratamento de erros (cuidado em produção)
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always
