name: CI/CD — Sistema de Diversidades

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, main]

env:
  MAVEN_OPTS: "-Dfile.encoding=UTF-8"

jobs:

  # ──────────────────────────────────────────
  # Job 1 — Build
  # ──────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Corrigir encoding
        run: |
          find src/main/resources -type f \( -name "*.properties" -o -name "*.yml" -o -name "*.yaml" \) | while read f; do
            iconv -f UTF-8 -t UTF-8 -c "$f" > /tmp/_fixed && mv /tmp/_fixed "$f" || true
          done

      - name: Compilar e empacotar
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests -B

      - name: Salvar artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar


  # ──────────────────────────────────────────
  # Job 2 — Testes
  # ──────────────────────────────────────────
  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Corrigir encoding
        run: |
          find src/main/resources -type f \( -name "*.properties" -o -name "*.yml" -o -name "*.yaml" \) | while read f; do
            iconv -f UTF-8 -t UTF-8 -c "$f" > /tmp/_fixed && mv /tmp/_fixed "$f" || true
          done

      - name: Executar testes
        run: |
          chmod +x mvnw
          ./mvnw test -Dspring.profiles.active=test -B


  # ──────────────────────────────────────────
  # Job 3 — Docker push para GHCR
  # ──────────────────────────────────────────
  docker-push:
    name: Docker para GHCR
    runs-on: ubuntu-latest
    needs: test

    # ✔️ suporta main e master
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ✔️ converte owner para lowercase (corrige erro do Docker)
      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/sistema-de-diversidades:latest
            ghcr.io/${{ env.OWNER_LC }}/sistema-de-diversidades:${{ github.sha }}


  # ──────────────────────────────────────────
  # Job 4 — Deploy Staging
  # ──────────────────────────────────────────
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: docker-push
    environment: staging

    steps:
      - name: Deploy no staging
        run: |
          echo "Deploy staging concluido"
          echo "Imagem: ghcr.io/${{ env.OWNER_LC }}/sistema-de-diversidades:${{ github.sha }}"


  # ──────────────────────────────────────────
  # Job 5 — Deploy Production
  # ──────────────────────────────────────────
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production

    steps:
      - name: Deploy em produção
        run: |
          echo "Deploy production concluido"
          echo "Imagem: ghcr.io/${{ env.OWNER_LC }}/sistema-de-diversidades:${{ github.sha }}"
