name: CI/CD — Sistema de Diversidades

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sistema-de-diversidades
  MAVEN_OPTS: "-Dfile.encoding=UTF-8"

jobs:

  # ──────────────────────────────────────────
  # Job 1 — Build
  # ──────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 🔧 ALINHADO COM O POM (Java 17)
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'   # 🔧 substitui actions/cache (mais confiável)

      # ❌ REMOVIDO cache manual (duplicado)
      # actions/cache não é necessário quando usa cache: maven

      - name: Corrigir encoding (BOM / Windows-1252)
        run: |
          find src/main/resources -type f \( -name "*.properties" -o -name "*.yml" -o -name "*.yaml" \) | while read f; do
            iconv -f UTF-8 -t UTF-8 -c "$f" > /tmp/_fixed && mv /tmp/_fixed "$f" || true
          done

      - name: Compilar e empacotar
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests -B

      - name: Salvar artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # ──────────────────────────────────────────
  # Job 2 — Testes
  # ──────────────────────────────────────────
  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      # 🔧 MESMO AJUSTE AQUI
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Corrigir encoding (BOM / Windows-1252)
        run: |
          find src/main/resources -type f \( -name "*.properties" -o -name "*.yml" -o -name "*.yaml" \) | while read f; do
            iconv -f UTF-8 -t UTF-8 -c "$f" > /tmp/_fixed && mv /tmp/_fixed "$f" || true
          done

      - name: Executar testes (perfil H2)
        run: |
          chmod +x mvnw
          ./mvnw test -Dspring.profiles.active=test -B

  # ──────────────────────────────────────────
  # Job 3 — Docker push para GHCR
  # ──────────────────────────────────────────
  docker-push:
    name: Docker para GHCR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ──────────────────────────────────────────
  # Job 4 — Deploy Staging
  # ──────────────────────────────────────────
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: docker-push
    environment: staging
    steps:
      - name: Deploy no ambiente de staging
        run: |
          echo "Deploy staging concluido"
          echo "Imagem: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Ambiente: staging"

  # ──────────────────────────────────────────
  # Job 5 — Deploy Production
  # ──────────────────────────────────────────
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - name: Deploy no ambiente de producao
        run: |
          echo "Deploy production concluido"
          echo "Imagem: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Ambiente: production"
