name: CI/CD — Sistema de Diversidades

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sistema-de-diversidades

jobs:

  # ──────────────────────────────────────────
  # Job 1 — Build
  # ──────────────────────────────────────────
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Compilar e empacotar
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests -B

      - name: Salvar artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # ──────────────────────────────────────────
  # Job 2 — Testes (H2 in-memory)
  # ──────────────────────────────────────────
  test:
    name: 🧪 Testes
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Executar testes (perfil H2)
        run: |
          chmod +x mvnw
          ./mvnw test -Dspring.profiles.active=test -B

  # ──────────────────────────────────────────
  # Job 3 — Build da imagem Docker e push GHCR
  # Roda apenas em push na main
  # ──────────────────────────────────────────
  docker-push:
    name: 🐳 Docker → GHCR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ──────────────────────────────────────────
  # Job 4 — Deploy Staging (automático)
  # ──────────────────────────────────────────
  deploy-staging:
    name: 🚀 Deploy — Staging
    runs-on: ubuntu-latest
    needs: docker-push
    environment: staging
    steps:
      - name: Deploy no ambiente de staging
        run: |
          echo "✅ Deploy staging concluído"
          echo "Imagem: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Ambiente: staging | URL: http://staging.sistema-diversidades.local:8080"

  # ──────────────────────────────────────────
  # Job 5 — Deploy Production (gate manual)
  # Configure: Settings > Environments > production > Required reviewers
  # ──────────────────────────────────────────
  deploy-production:
    name: 🏭 Deploy — Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - name: Deploy no ambiente de produção
        run: |
          echo "🏭 Deploy production concluído"
          echo "Imagem: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Ambiente: production | URL: http://sistema-diversidades.local:8080"
